<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 232" width="1080" height="232" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8978b"/>
    </marker>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #3d2f28; }
      .sub { font-size: 13.5px; fill: #7a685d; }
      .note { font-size: 13px; fill: #a8978b; font-style: italic; }
      .edge { stroke: #a8978b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1080" height="232" rx="16" fill="#ffffff"/>

  <!-- feedback: the lifelong map is the target of the next session -->
  <path d="M980,98 V38 H305 V94" class="edge" stroke-dasharray="6 5"/>
  <path d="M765,38 V94" class="edge" stroke-dasharray="6 5"/>
  <text x="642" y="30" class="note" text-anchor="middle">previous lifelong map</text>

  <!-- input -->
  <rect x="20" y="102" width="150" height="104" rx="18" fill="#f1ece6"/>
  <text x="95" y="148" class="title" text-anchor="middle">New session</text>
  <text x="95" y="172" class="sub" text-anchor="middle">scans + odometry</text>
  <path d="M170,154 H204" class="edge"/>

  <!-- stages -->
  <rect x="210" y="98" width="190" height="112" rx="18" fill="#ffcbb8"/>
  <text x="305" y="141" class="title" text-anchor="middle">Window-based</text>
  <text x="305" y="163" class="title" text-anchor="middle">Registration</text>
  <text x="305" y="188" class="sub" text-anchor="middle">align submaps to the map</text>
  <path d="M400,154 H434" class="edge"/>

  <rect x="440" y="98" width="196" height="112" rx="18" fill="#ffe2a8"/>
  <text x="538" y="141" class="title" text-anchor="middle">Dynamic Object</text>
  <text x="538" y="163" class="title" text-anchor="middle">Removal</text>
  <text x="538" y="188" class="sub" text-anchor="middle">voxel hit / exposure</text>
  <path d="M636,154 H664" class="edge"/>

  <rect x="670" y="98" width="190" height="112" rx="18" fill="#f9c9dc"/>
  <text x="765" y="141" class="title" text-anchor="middle">Voxel Ratio Map</text>
  <text x="765" y="163" class="title" text-anchor="middle">Update</text>
  <text x="765" y="188" class="sub" text-anchor="middle">accumulate evidence</text>
  <path d="M860,154 H894" class="edge"/>

  <!-- output -->
  <rect x="900" y="102" width="160" height="104" rx="18" fill="#cfe8cf"/>
  <text x="980" y="148" class="title" text-anchor="middle">Lifelong</text>
  <text x="980" y="172" class="title" text-anchor="middle">static map</text>
</svg>
